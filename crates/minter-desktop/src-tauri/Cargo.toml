[package]
name = "minter-desktop"
version = "1.1.0"
description = "MINTER desktop — OpenSea drop minter & raw sniper (Tauri 2, Windows)"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MaxBetov-pdd/Minter-rs-v2"
homepage = "https://github.com/MaxBetov-pdd/Minter-rs-v2"
authors = ["Andark <andarx4nok@gmail.com>"]
readme = "../../../README.md"

[lib]
name = "minter_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
minter-core = { path = "../../minter-core" }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
parking_lot = "0.12"
rfd = "0.15"
getrandom = "0.2"
sha2 = "0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
